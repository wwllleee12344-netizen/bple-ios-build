  email:
    recipients:
      - dontclickgmai29@gmail.com

workflows:
  unity-ios:
    name: Unity iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    scripts:
      - name: Extract and Build iOS App
        script: |
          set -euo pipefail
          EXTRACT_DIR="$CM_BUILD_DIR/extracted_project"
          OUTPUT_DIR="$CM_BUILD_DIR/output"
          ARCHIVE_PATH="$(find "$CM_BUILD_DIR" -type f -name 'BPLE-2022.1.4.7z' -print -quit)"
          if [ -z "$ARCHIVE_PATH" ]; then
            ARCHIVE_PATH="$(find "$CM_BUILD_DIR" -type f -name 'BPLE-2022.1.4.zip' -print -quit)"
          fi
          if [ -z "$ARCHIVE_PATH" ]; then
            echo "Could not find BPLE-2022.1.4.7z or BPLE-2022.1.4.zip in the build directory."
            exit 1
          fi

          mkdir -p "$EXTRACT_DIR"
          case "$ARCHIVE_PATH" in
            *.7z)
              if ! command -v 7zz >/dev/null 2>&1 && ! command -v 7z >/dev/null 2>&1; then
                brew install sevenzip
              fi
              if command -v 7zz >/dev/null 2>&1; then
                7zz x -y "-o$EXTRACT_DIR" "$ARCHIVE_PATH"
              else
                7z x -y "-o$EXTRACT_DIR" "$ARCHIVE_PATH"
              fi
              ;;
            *.zip)
              unzip -o "$ARCHIVE_PATH" -d "$EXTRACT_DIR"
              ;;
          esac

          PROJECT_FILE="$(find "$EXTRACT_DIR" -type d -name Unity-iPhone.xcodeproj -print -quit)"
          if [ -z "$PROJECT_FILE" ]; then
            echo "Archive does not contain a Unity-iPhone.xcodeproj."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$PROJECT_FILE")"

          for library in \
            "$PROJECT_DIR/Libraries/libiPhone-lib.a" \
            "$PROJECT_DIR/Libraries/libil2cpp.a" \
            "$PROJECT_DIR/Libraries/baselib.a"; do
            if [ ! -s "$library" ]; then
              echo "Required iOS library is missing or empty: $library"
              exit 1
            fi
            first_line="$(head -n 1 "$library")"
            if [ "$first_line" = "version https://git-lfs.github.com/spec/v1" ]; then
              echo "Archive contains a Git LFS pointer instead of the actual library: $library"
              echo "Download the LFS objects before creating and uploading the archive."
              exit 1
            fi
          done

          xcodebuild build \
            -project "$PROJECT_FILE" \
            -scheme "Unity-iPhone" \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$OUTPUT_DIR" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

          APP_PATH="$(find "$OUTPUT_DIR" -type d -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "Xcode build succeeded but did not produce an .app in $OUTPUT_DIR."
            exit 1
          fi

          mkdir -p "$OUTPUT_DIR/Payload" "$CM_BUILD_DIR/build"
          cp -R "$APP_PATH" "$OUTPUT_DIR/Payload/"
          (cd "$OUTPUT_DIR" && zip -r "$CM_BUILD_DIR/build/BPLE.ipa" Payload)
          rm -rf "$OUTPUT_DIR/Payload"
    artifacts:
      - build/*.ipa