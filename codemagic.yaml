      - name: Download Project Files from Google Drive
        script: |
          set -e
          cd $CM_BUILD_DIR
          echo "Downloading project archive directly from Google Drive..."
          
          # Clean up any legacy artifacts from previous workflows
          rm -f cookies.txt BPLE-2022.1.4.7z
          
          # MUST USE ://google.com for the automated token extraction layer
          curl -L -c cookies.txt "https://://google.com?export=download&id=1LmTQBRjwbp0BrDxHeNFiq2V9QNfKxsbu" > /dev/null
          CONFIRM_CODE=$(grep -o 'confirm=[^&]*' cookies.txt | cut -d= -f2 || echo "")
          
          if [ -n "$CONFIRM_CODE" ]; then
            echo "Confirmation code received. Downloading large payload..."
            curl -L -b cookies.txt "https://://google.com?export=download&confirm=${CONFIRM_CODE}&id=1LmTQBRjwbp0BrDxHeNFiq2V9QNfKxsbu" -o BPLE-2022.1.4.7z
          else
            echo "Downloading standard payload..."
            curl -L "https://://google.com?export=download&id=1LmTQBRjwbp0BrDxHeNFiq2V9QNfKxsbu" -o BPLE-2022.1.4.7z
          fi
          rm -f cookies.txt
          
          echo "Extracting project files via 7za..."
          7za x BPLE-2022.1.4.7z -oextracted_project
