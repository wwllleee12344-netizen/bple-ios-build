workflows:
  unity-ios:
    name: Unity iOS Build
    max_build_duration: 120
    instance_type: mac_mini_m2
    scripts:
      - name: Download Project Files from Google Drive
        script: |
          set -e
          rm -f cookies.txt confirm.txt

          FILE_ID="PASTE_YOUR_NEW_FILE_ID_HERE"
          OUTPUT_NAME="BPLE-2022.1.4.7z"

          curl -c cookies.txt -s -L "https://google.com{FILE_ID}" | sed -rn 's/.*confirm=([0-9A-Za-z_]+).*/\1/p' > confirm.txt
          curl -L -b cookies.txt -o "$OUTPUT_NAME" "https://google.com{FILE_ID}&confirm=$(cat confirm.txt)"

          rm -f confirm.txt cookies.txt

      - name: Extracting project files via 7za...
        script: |
          set -e
          7za x BPLE-2022.1.4.7z -oextracted_project

      - name: Fix Bundle Version Formatting
        script: |
          set -e
          TARGET_DIR=$(find $CM_BUILD_DIR/extracted_project -type d -name "BPLE-*" | head -n 1)
          cd "$TARGET_DIR"

          PLIST_PATH="Info.plist"
          if [ ! -f "$PLIST_PATH" ]; then
            PLIST_PATH="Unity-iPhone/Info.plist"
          fi

          if [ -f "$PLIST_PATH" ]; then
            echo "Modifying Info.plist version strings to clear Xcode rules..."
            sed -i '' 's/2022.1-4/2022.1.4/g' "$PLIST_PATH"
          fi

      - name: Install Pod Dependencies
        script: |
          set -e
          pod install
